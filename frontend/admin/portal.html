<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal · AXA Cleaning</title>
  <meta name="robots" content="noindex"><meta name="theme-color" content="#0a2540">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/admin.js"></script>
</head>
<body class="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g></symbol>
  <symbol id="i-agents" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/></g></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.3 7.5 9.5 4.4-1.2 7.5-4.9 7.5-9.5V6z"/><circle cx="12" cy="10" r="2.5"/><path d="M8 16c.8-1.6 2.2-2.4 4-2.4s3.2.8 4 2.4"/></g></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></g></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></g></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4-6.5 8-6.5s7 2.3 8 6.5"/></g></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></g></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></g></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.8"/></g></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></g></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></g></symbol>

<aside class="sidebar" aria-label="Portal navigation">
  <a class="sb-brand" href="#/dashboard"><img src="/assets/axa-cleaning-logo.jpeg" alt="" width="42" height="42"><span>AXA <b>Cleaning</b><small>Staff portal</small></span></a>
  <nav class="sb-nav">
    <a href="#/dashboard" data-route="dashboard"><svg><use href="#i-dash"/></svg>Dashboard</a>
    <a href="#/bookings" data-route="bookings"><svg><use href="#i-cal"/></svg>Bookings<span class="sb-badge" id="pendingBadge" hidden></span></a>
    <a href="#/agents" data-route="agents"><svg><use href="#i-agents"/></svg>Cleaning agents</a>
    <a href="#/packages" data-route="packages"><svg><use href="#i-box"/></svg>Packages</a>
    <a href="#/users" data-route="users" data-min="manager"><svg><use href="#i-users"/></svg>Users & roles</a>
    <a href="#/activity" data-route="activity" data-min="manager"><svg><use href="#i-log"/></svg>Activity log</a>
    <a href="#/messages" data-route="messages"><svg><use href="#i-mail"/></svg>Contact messages</a>
    <a href="#/settings" data-route="settings" data-min="superadmin"><svg><use href="#i-globe"/></svg>Business settings</a>
    <a href="#/profile" data-route="profile"><svg><use href="#i-user"/></svg>My account</a>
  </nav>
  <div class="sb-foot">
    <a class="sb-site" href="/" target="_blank" rel="noopener"><svg><use href="#i-globe"/></svg>View website</a>
    <div class="me"><span class="avatar" id="meAvatar"></span><div><b id="meName"></b><small id="meRole"></small></div><button class="icon-btn" id="logout" title="Sign out" aria-label="Sign out"><svg><use href="#i-logout"/></svg></button></div>
  </div>
</aside>
<div class="sb-scrim"></div>

<div class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
    <h1 id="pageTitle">Dashboard</h1>
    <div class="top-actions">
      <label class="language-control"><span class="sr-only">Language</span><select data-language-select aria-label="Language"><option value="en">English</option><option value="ro">Română</option></select></label>
      <button class="btn btn-primary btn-sm" id="newBookingBtn"><svg><use href="#i-plus"/></svg><span>New booking</span></button>
      <div class="bell-wrap">
        <button class="icon-btn bell" id="bellBtn" aria-label="Notifications" aria-expanded="false"><svg><use href="#i-bell"/></svg><span class="bell-count" hidden></span></button>
        <div class="notif-panel" id="notifPanel" hidden>
          <div class="np-head"><b>Notifications</b><button class="linklike" id="markAll">Mark all read</button></div>
          <div class="np-list" id="notifList"></div>
          <div class="np-foot"><button class="linklike" id="enableDesktop">Enable desktop alerts</button></div>
        </div>
      </div>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div class="drawer" id="drawer" hidden><div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-btn" data-close-drawer aria-label="Close"><svg><use href="#i-x"/></svg></button></div><div class="drawer-body" id="drawerBody"></div></div></div>
<div class="modal" id="modal" hidden><div class="window" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="window-bar"><span class="lights"><i></i><i></i><i></i></span><h3 id="modalTitle"></h3><button class="icon-btn" data-close-modal aria-label="Close"><svg><use href="#i-x"/></svg></button></div><div class="window-body" id="modalBody"></div></div></div>
<div class="toasts" aria-live="assertive"></div>
</body>
</html>
